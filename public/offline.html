    <style>

      .mark { width: 56px; height: 56px; margin: 0 auto 14px; }

        display: inline-block; background: #2947d6; color: #fff; text-decoration: none;
        font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 10px;
      }
