<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ujyalo Learn — Learn today. Lead tomorrow.</title>
    <meta
      name="description"
      content="Free lessons, practice questions, timed mock exams and a verified opportunities directory for students in Nepal, Grades 1–12. Learn today. Lead tomorrow.">
    <meta name="theme-color" content="#F8F7F2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0E1B2E" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <!-- Google Search reads the icon declared here, not the manifest, and it
         does not accept SVG: it wants a square PNG/ICO larger than 48x48. The
         missing /favicon.ico was why search results showed a generic globe. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- Self-hosted typefaces. Preloaded so the first paint is in the real
         face rather than a fallback that reflows the headline. -->
    <link rel="preload" href="/fonts/manrope-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/dm-sans-var.woff2" as="font" type="font/woff2" crossorigin>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ujyalo Learn">
    <meta property="og:title" content="Ujyalo Learn — Learn today. Lead tomorrow.">
    <meta
      property="og:description"
      content="Lessons, practice, timed mock exams and a verified opportunities directory for students in Nepal. Grades 1–12. Free to start.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ujyalo Learn — Learn today. Lead tomorrow.">
    <meta name="twitter:description" content="Lessons, practice questions, mock exams and real opportunities for students in Nepal, Grades 1–12.">
    <meta name="twitter:image" content="/og-image.png">
    <!-- External, not inline, so the CSP can forbid inline scripts. Must stay
         blocking and before the body to avoid a flash of the wrong theme. -->
    <script src="/theme-boot.js"></script>
    <!-- Google Analytics. Loads nothing until the visitor accepts analytics,
         and lives in its own file so the CSP can forbid inline scripts. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    <script defer src="/analytics.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem; margin: 0 auto">
        <h1>Ujyalo Learn</h1>
        <p>Ujyalo Learn needs JavaScript to run the AI tutor, quizzes and study tools. Please enable JavaScript in your browser.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
