name: CI

# Runs on every push and pull request. A failing gate blocks the build, and
# Vercel should be configured to only promote a deployment when this passes
# (see docs/DEPLOYMENT.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly the lockfile, so CI cannot drift from review.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Check no secrets are committed
        run: npm run check:secrets

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # postbuild runs generate-seo.mjs and check-prerender.mjs, so this step
      # fails if the sitemap, metadata, JSON-LD or prerendered HTML regress.
      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://ujyalo-learn.vercel.app

      - name: Verify the client bundle carries no server secrets
        run: npm run check:bundle

      # Guards against the failure mode this job was written for: pages that
      # prerender cleanly but serve a crawler ~130 words of header and footer.
      # Legal pages are exempt by design — padding them is worse than thin.
      - name: Check prerendered pages are not thin
        run: node scripts/measure-prerender.mjs --check

      - name: Upload the build so the browser job can reuse it
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  api:
    name: API integration (mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Starts its own mock provider and dev API on free ports. No paid key needed.
      - name: API smoke tests
        run: npm run smoke:api

  arena:
    name: Quiz Arena scoring and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      # 45 assertions against the real HTTP API and the Firestore emulator:
      # the answer key never reaches the client, scoring is server-side, a
      # replayed submission awards nothing, an impossibly fast one is refused,
      # and the leaderboards only contain players who actually scored.
      - name: Arena end-to-end (scoring, replay, tampering, rankings)
        run: npm run test:arena

  browser:
    name: Browser end-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite needs both the Vite app and the dev API.
      - name: Start the app
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then echo "app is up"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/api/health || (cat /tmp/dev.log; exit 1)

      - name: Browser suite
        run: npm run test:ui
        env:
          BASE_URL: http://127.0.0.1:5173

      - name: Accessibility audit (WCAG 2.1 AA, light + dark + mobile)
        run: npm run test:a11y
        env:
          BASE_URL: http://127.0.0.1:5173

      # The brief's acceptance test, literally: open the site, click through
      # public pages, reach a tool with no account, back/forward, refresh,
      # sign up voluntarily — on desktop, tablet and phone.
      - name: Navigation without an account
        run: node scripts/verify-navigation.mjs
        env:
          BASE_URL: http://127.0.0.1:5173

      # Plays a whole practice quiz in a real Chromium and checks the results,
      # the empty leaderboard, the profile 404 and the mobile layout. The ranked
      # path is covered by the `arena` job above, which has a database.
      - name: Quiz Arena browser run
        run: node scripts/arena-ui.mjs
        env:
          BASE_URL: http://127.0.0.1:5173

      - name: Stop the app
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true

      - name: Upload failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            docs/screenshots
            /tmp/dev.log
          retention-days: 7

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The Firestore emulator is a Java process and firebase-tools requires 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      # 72 assertions: student isolation, role escalation, draft leakage,
      # append-only audit log, and the shipped seed content passing its own rules.
      - name: Rules tests against the emulator
        run: npm run test:rules
      # The rules pass in isolation does not prove the app is wired to them.
      # This drives the real UI through signup, onboarding, a write, a reload
      # and a second account, against the same emulators.
      - run: npx playwright install --with-deps chromium
      - name: Firebase end-to-end (signup, cloud persistence, isolation)
        run: npm run test:firebase

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fails on a critical vulnerability only. High and below are reported by
      # the scheduled job, because a build-tool transitive advisory should not
      # block a content fix.
      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical
